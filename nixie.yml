# Nixie — netclaw agent deployment.
#
# Secrets and per-deployment identity live in .env (gitignored):
#   GH_TOKEN, GIT_USER_NAME, GIT_USER_EMAIL, GIT_USER_KEY, AGENT_NAME
# Copy .env.example to .env to get started. COMPOSE_FILE=nixie.yml is set there
# too, so plain `docker compose up -d` works without -f.
#
# The dev toolset (dotnet, node, rg, kubectl, ...) is provisioned into the
# `tools` volume by tools-init and mounted read-only at /tools. The netclaw
# image already carries /tools/bin on its PATH and its entrypoint has an
# `ensure_tools_accessible /tools` step built for exactly this, so no PATH
# override is needed here — never set PATH in this file, it would replace the
# image's value wholesale.

volumes:
  tools:
  redis-data:
  searxng-data:

services:
  # ---- init: build + provision the /tools volume, then exit ----------------
  tools-init:
    build:
      context: ./tools-init
      args:
        # All pinned to the latest release as of 2026-08-06, verified fetchable.
        # DOTNET_EXTRA_* are opt-in *lists*, not versions — empty means "install
        # none", so they stay empty unless a client repo needs a second SDK.
        BRUNO_VERSION: "4.0.0"
        CSHARP_LS_VERSION: "0.26.0"
        DOTNET_EF_VERSION: "10.0.10"
        DOTNET_EXTRA_RUNTIMES: ""
        DOTNET_EXTRA_SDKS: ""            # space-separated, e.g. "8.0.405"
        DOTNET_OUTDATED_TOOL_VERSION: "4.8.1"
        DOTNET_SCRIPT_VERSION: "2.0.1"
        DOTNET_VERSION: "10.0.302"
        GH_VERSION: "2.97.0"             # netclaw's apt gh is 2.45.0; ours wins on PATH
        GITHUB_MCP_VERSION: "v1.8.0"
        HELM_VERSION: "v4.2.3"
        HUGO_VERSION: "0.164.0"
        IMPECCABLE_VERSION: "3.5.0"
        KUBECTL_VERSION: "v1.36.3"
        MCP_SEARXNG_VERSION: "1.14.0"
        NODE_VERSION: "26.7.0"
        PAKET_VERSION: "10.3.1"
        QMD_VERSION: "2.5.3"
        RIPGREP_VERSION: "15.2.0"
        SOPS_VERSION: "v3.13.3"
        TERRAFORM_VERSION: "1.15.8"
        YQ_VERSION: "v4.53.3"
    container_name: netclaw-tools-init
    environment:
      # Manual override only. Normal upgrades are detected via the build stamp
      # baked into the image, so bumping a version arg above is enough.
      TOOLS_REVISION: "${TOOLS_REVISION:-}"
    volumes:
      - tools:/out                       # NOT /tools — the image builds at /tools
    restart: "no"

  # ---- init: netclaw config, git identity, MCP servers, workspace ----------
  # Uses the netclaw image purely for its CLI. `netclaw mcp add` is a plain
  # config write and needs no daemon, so this runs before netclaw starts.
  config-init:
    image: ghcr.io/netclaw-dev/netclaw:0.25.4
    container_name: netclaw-config-init
    entrypoint: ["/bin/bash", "/init/setup.sh"]
    depends_on:
      # Needed for /tools/bin/ssh: the netclaw image ships no ssh client, so
      # cloning an ssh:// or git@host: workspace repo fails with
      # "error: cannot run ssh: No such file or directory" without it.
      tools-init:
        condition: service_completed_successfully
    environment:
      # Identity comes from .env — see .env.example.
      # GIT_USER_NAME/EMAIL are required rather than defaulted: they are written
      # into commits, and a silently-wrong default would end up in immutable
      # history. AGENT_NAME only affects the persona, so it defaults.
      AGENT_NAME: "${AGENT_NAME:-Nixie}"
      GH_TOKEN: "${GH_TOKEN:?set GH_TOKEN in .env}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:?set GIT_USER_EMAIL in .env}"
      GIT_USER_KEY: "${GIT_USER_KEY:-}"
      GIT_USER_NAME: "${GIT_USER_NAME:?set GIT_USER_NAME in .env}"
      NETCLAW_HOME: /home/netclaw/.netclaw
      # Whitespace-separated list. Each entry is "<url>", cloned to
      # $WORKSPACE_ROOT/<repo-name>, or "<url>=<subdir>" to override the
      # directory. Clone-only and best-effort per repo — see setup.sh.
      WORKSPACE_REPOS: "${WORKSPACE_REPOS:-}"
      # Extra flags for each `git clone`. --filter=blob:none makes these partial
      # clones: full history and commit graph, file contents fetched on demand.
      #
      # Single dash, not ":-": ":-" treats an empty value as unset and would
      # substitute the default back in, so `WORKSPACE_CLONE_ARGS=` in .env could
      # never mean "plain full clone". With "-" only an *unset* variable gets
      # the default, and an explicit empty value survives.
      WORKSPACE_CLONE_ARGS: "${WORKSPACE_CLONE_ARGS---filter=blob:none}"
      # Defaults to netclaw's own convention for the projects directory. Any
      # per-client grouping (.../workspaces/<client>) belongs in .env, not here.
      WORKSPACE_ROOT: "${WORKSPACE_ROOT:-/home/netclaw/.netclaw/workspaces}"
    volumes:
      - ./netclaw:/home/netclaw/.netclaw
      - ./config-init:/init:ro
      # Mounted rw so setup.sh can repair ownership/modes. netclaw's own
      # entrypoint only ever repairs $NETCLAW_HOME, never these.
      - ./cache:/chown/cache
      - ./nuget:/chown/nuget
      - ./ssh:/chown/ssh
      # Read-only, purely to borrow /tools/bin/ssh for ssh-URL workspace clones.
      - tools:/tools:ro
    restart: "no"

  # ---- sidecar: Redis ------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: netclaw-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- sidecar: headless Chromium over CDP ---------------------------------
  # Chrome cannot live in /tools: it needs ~30 shared libs netclaw lacks plus
  # fonts, dbus and a writable sandbox. A sidecar over CDP is the compose-native
  # answer.
  chrome:
    image: ghcr.io/browserless/chromium:v2.55.3
    container_name: netclaw-chrome
    restart: unless-stopped
    shm_size: "1gb"                      # Chrome crashes on the 64MB default
    environment:
      CONCURRENT: "3"
      # browserless logs through the npm `debug` package and traces every
      # request by default — the 15s /pressure healthcheck alone is ~5 log
      # lines per probe. Keep info/warn/error, drop the trace/debug firehose.
      # index:info is also dropped: it only carries the 5-minute metrics
      # heartbeat ("Current period usage", "Saving metrics to ...").
      DEBUG: "browserless.io:*,-browserless.io:*:trace,-browserless.io:*:debug,-browserless.io:index:info"
      TIMEOUT: "60000"
      # Self-issued shared secret — browserless v2 rejects any connection whose
      # ?token= does not match. Not a vendor credential. It lives in .env, where
      # setup.sh generates one per deployment, rather than here: a token
      # hardcoded in a template would be identical in every fork.
      TOKEN: "${BROWSERLESS_TOKEN:?run ./setup.sh, or set BROWSERLESS_TOKEN in .env}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf \"http://127.0.0.1:3000/pressure?token=$$TOKEN\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---- sidecar: SearXNG metasearch -----------------------------------------
  # Self-hosted web search: no API key, no per-query SaaS bill, and queries
  # stay on the compose network (no ports published). Config is the committed
  # ./searxng/settings.yml. Pinned to a dated tag — SearXNG has no semver
  # releases, so bumps are deliberate edits here. Do not trust the tag names
  # to sort by recency: the date is the source date, not the build order, and
  # an older-named tag can carry a newer build. When bumping, pick the tag
  # whose digest matches upstream's `latest`.
  searxng:
    image: docker.io/searxng/searxng:2026.8.4-c63835bd2
    container_name: netclaw-searxng
    restart: unless-stopped
    environment:
      # The entrypoint chown -Rs /etc/searxng when it is not owned by
      # searxng:searxng — on a read-only mount that fails noisily on every
      # start. false turns it into a single clean warning.
      FORCE_OWNERSHIP: "false"
      SEARXNG_BASE_URL: "http://searxng:8080/"
      # Cookie/HMAC signing secret. SearXNG refuses to start while the key is
      # the template's "ultrasecretkey"; this env var overrides settings.yml,
      # so the committed config stays secret-free. Self-issued, not a vendor
      # credential — setup.sh generates one per deployment.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?run ./setup.sh, or set SEARXNG_SECRET in .env}"
    volumes:
      - ./searxng:/etc/searxng:ro          # settings.yml only; never written
      - searxng-data:/var/cache/searxng    # engine/data caches
    healthcheck:
      # wget, not curl: the image ships only wget. /healthz answers without
      # touching any upstream engine, so egress-blocked hosts still pass.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---- the agent -----------------------------------------------------------
  netclaw:
    image: ghcr.io/netclaw-dev/netclaw:0.25.4
    container_name: netclaw
    restart: unless-stopped
    ports:
      # Management UI. netclaw-ui shares this container's network namespace
      # (network_mode below), so its port is published here — the first and
      # only published port in the stack, and that is deliberate. Host-loopback
      # by default: the UI has no login and holds Operator power over the
      # daemon. Change the port half freely; widen the address half only with
      # an authenticating proxy in front. The daemon's own 5199 stays
      # unpublished either way.
      - "${NETCLAW_UI_BIND:-127.0.0.1:5198}:5198"
    cap_add:
      - NET_RAW                          # tcpdump / raw sockets
    depends_on:
      tools-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chrome:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      # Same secret as the chrome sidecar's TOKEN above; both read .env, so they
      # cannot drift apart.
      BROWSER_WS_ENDPOINT: "ws://chrome:3000?token=${BROWSERLESS_TOKEN}"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "0"
      DOTNET_NOLOGO: "1"
      # Major, not LatestPatch: paket/dotnet-ef/dotnet-outdated target net9.0 and
      # net8.0 even at their latest versions, and LatestPatch refuses to roll
      # across a major, failing with "You must install or update .NET". Major
      # runs them on the 10.0 runtime instead of vendoring two more runtimes.
      DOTNET_ROLL_FORWARD: Major
      DOTNET_ROOT: /tools/dotnet
      GH_TOKEN: "${GH_TOKEN:?set GH_TOKEN in .env}"
      # github-mcp-server reads this. `netclaw mcp add --env` does not persist,
      # so the stdio child picks it up by inheriting the daemon's environment.
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GH_TOKEN}"
      # /home/netclaw is plain container layer — only .netclaw is mounted — so
      # ~/.gitconfig cannot survive a recreate. Point git at the mount instead.
      GIT_CONFIG_GLOBAL: /home/netclaw/.netclaw/gitconfig
      MAGIC: /tools/rootfs/usr/share/misc/magic.mgc
      PUPPETEER_SKIP_DOWNLOAD: "1"
      REDIS_URL: redis://redis:6379
      RTK_TELEMETRY_DISABLED: "1"
      # mcp-searxng reads this. Same rule as GITHUB_PERSONAL_ACCESS_TOKEN
      # above: `netclaw mcp add --env` does not persist, so the stdio child
      # inherits it from the daemon's environment.
      SEARXNG_URL: "http://searxng:8080"
    volumes:
      - ./netclaw:/home/netclaw/.netclaw
      - ./cache:/home/netclaw/.cache
      - ./nuget:/home/netclaw/.nuget
      - ./ssh:/home/netclaw/.ssh:ro      # keys + config + known_hosts
      - tools:/tools:ro                  # entrypoint supports ro by design
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5199/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---- sidecar: management UI (unofficial) ---------------------------------
  # codymullins/netclaw-ui, a Blazor Server management UI for the daemon,
  # built from a pinned commit by ui/Dockerfile (upstream ships no image).
  #
  # It shares the netclaw container's network namespace so its calls reach the
  # loopback-bound control plane at 127.0.0.1:5199 as a genuine loopback
  # caller, which the daemon auto-authenticates as Operator — no device token,
  # no daemon config change. That netns membership is a deliberate auth grant,
  # which is exactly why the other sidecars do NOT get it: chrome and searxng
  # handle untrusted web content and must never see the daemon's loopback.
  # Flip side of sharing: the UI's host port is published on the netclaw
  # service (see ports: there), and recreating netclaw recreates this
  # container with it.
  #
  # The UI has NO authentication of its own and wields Operator power, so the
  # default publish is host-loopback only. Four of its calls target endpoints
  # that exist only in the author's netclaw fork, not stock 0.25.4 — the Model
  # page, the Discord config tab and Stop/Restart degrade to an
  # unreachable-style state instead of working. See README.
  netclaw-ui:
    build:
      context: ./ui
      args:
        # Full commit SHA of codymullins/netclaw-ui. The netclaw submodule
        # revision is pinned by this commit itself (gitlink), not by us.
        UI_REVISION: "edc8cddc219800c6fbc709454d0f47df200a2c2f"
        # Build SDK matches the UI repo's global.json exactly (it builds with
        # TreatWarningsAsErrors, so a newer SDK's new analyzer warnings would
        # break the build); runtime is the aspnet patch current as of
        # 2026-08-06.
        DOTNET_SDK_TAG: "10.0.203"
        DOTNET_ASPNET_TAG: "10.0.10"
    container_name: netclaw-ui
    restart: unless-stopped
    network_mode: "service:netclaw"
    depends_on:
      netclaw:
        condition: service_healthy       # also guarantees ./netclaw is chowned to 1654 by then
    environment:
      # 0.0.0.0, not loopback: published ports NAT to the container interface,
      # so a loopback bind would be unreachable from the host. Actual exposure
      # is gated by the host-side bind in netclaw's ports:.
      ASPNETCORE_URLS: "http://0.0.0.0:5198"
      # Top of the UI's endpoint resolution chain. Loopback ⇒ the daemon
      # grants Operator without a token (see the netns note above).
      NETCLAW_DAEMON_ENDPOINT: "http://127.0.0.1:5199"
      # Same tree the daemon uses: reads netclaw.json and secrets.json,
      # writes config/tool-approvals.json.
      NETCLAW_HOME: /home/netclaw/.netclaw
      # The publish output ships no appsettings.json, so every category logs
      # at Information and two pollers dominate stdout: the UI's own daemon
      # status poll (Refit HttpClient start/send/receive lines) and the
      # healthcheck curl above (AspNetCore request logs for / every 15s).
      # Scoped to those two categories so warnings, errors and the
      # Microsoft.Hosting.Lifetime startup lines still come through.
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    volumes:
      # rw on purpose — the Approvals page writes config/tool-approvals.json.
      - ./netclaw:/home/netclaw/.netclaw
    healthcheck:
      # Executes inside this container (shared netns, own filesystem). The UI
      # has no dedicated health endpoint; the Blazor root answering is the
      # signal. curl is installed by ui/Dockerfile for exactly this.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5198/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
